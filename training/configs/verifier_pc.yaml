# VerifierConfig for the Amendment v2 C-PC arm.
# Reads identically to verifier.yaml for the shared reward terms; adds the
# four proposer-critic fields gated by reward_fn_openrlhf_pc.

docking:
  receptor_pdbqt: /workspace/data/receptors/7L13/receptor.pdbqt
  center: [-21.2, -4.87, -28.82]   # 7L13 XF7 cocrystal centroid (data/receptors/7L13/receptor.config)
  size: [22.0, 22.0, 22.0]
  exhaustiveness: 16
  num_modes: 9
  n_seeds: 3
  vina_binary: vina

weights:
  dock: 0.50
  qed: 0.15
  sa: 0.15
  diversity: 0.20

curriculum:
  milestones:
    - [0, -5.0]
    - [100, -7.0]
    - [300, -8.0]

invalid_penalty: -1.0
pains_penalty: -0.5
reactive_penalty: -0.5
strain_threshold_kcal: 60.0
