rank_based_dock: false
multiturn_improvement_coef: 0.2

# --- Amendment v2 (proposer-critic) -----------------------------------------
proposer_critic_enabled: true
critic_alpha: 0.5
critic_min_dock_improvement_kcal: 0.5
critic_tanimoto_max: 0.7
within_role_baseline: true
